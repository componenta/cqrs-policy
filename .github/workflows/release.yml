name: Verify and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php: ['8.4', '8.5']
        cqrs: ['2.0.1', '3.0.3']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout policy v2 source
        uses: actions/checkout@v7
        with:
          repository: componenta/policy
          ref: main
          path: .ci/policy
      - name: Checkout composite-capable transport source
        uses: actions/checkout@v7
        with:
          repository: componenta/cqrs-transport
          ref: main
          path: .ci/cqrs-transport
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Use current integration sources
        shell: bash
        run: |
          composer config --json repositories.componenta-policy '{"type":"path","url":".ci/policy","options":{"versions":{"componenta/policy":"2.0.0"}}}'
          composer config --json repositories.componenta-cqrs-transport '{"type":"path","url":".ci/cqrs-transport","options":{"versions":{"componenta/cqrs-transport":"4.0.0"}}}'
      - name: Select CQRS version
        run: composer require --no-update "componenta/cqrs:${{ matrix.cqrs }}"
      - name: Install dependency matrix
        shell: bash
        env:
          COMPOSER_MAX_PARALLEL_HTTP: 2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 20))
          done
      - run: composer test
      - run: composer analyse

  verify-core-without-transport:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout policy v2 source
        uses: actions/checkout@v7
        with:
          repository: componenta/policy
          ref: main
          path: .ci/policy
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Use current policy v2 source
        run: >-
          composer config --json repositories.componenta-policy
          '{"type":"path","url":".ci/policy","options":{"versions":{"componenta/policy":"2.0.0"}}}'
      - name: Remove development-only dependencies from core verification manifest
        run: composer remove --dev --no-update componenta/cqrs-transport pestphp/pest phpstan/phpstan
      - name: Install production dependencies only
        shell: bash
        env:
          COMPOSER_MAX_PARALLEL_HTTP: 2
        run: composer update --no-dev --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Verify core provider loads without transport
        shell: bash
        run: |
          php -r '
          require "vendor/autoload.php";
          $config = (new Componenta\CQRS\Policy\ConfigProvider())();
          if (!is_array($config)) {
              throw new RuntimeException("Policy ConfigProvider did not return configuration.");
          }
          if (class_exists(Componenta\CQRS\Command\Transport\CommandSerializerInterface::class, false)) {
              throw new RuntimeException("Optional transport was loaded into the core-only install.");
          }
          '

  verify-core-with-older-transport:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout policy v2 source
        uses: actions/checkout@v7
        with:
          repository: componenta/policy
          ref: main
          path: .ci/policy
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Use current policy v2 source
        run: >-
          composer config --json repositories.componenta-policy
          '{"type":"path","url":".ci/policy","options":{"versions":{"componenta/policy":"2.0.0"}}}'
      - name: Select older optional transport
        run: composer require --dev --no-update componenta/cqrs-transport:3.0.1
      - name: Install dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Verify core works and optional integration rejects unsupported transport
        shell: bash
        run: |
          php -r '
          require "vendor/autoload.php";
          $config = (new Componenta\CQRS\Policy\ConfigProvider())();
          if (!is_array($config)) {
              throw new RuntimeException("Core policy ConfigProvider did not load.");
          }
          try {
              (new Componenta\CQRS\Policy\Transport\ConfigProvider())();
          } catch (LogicException $e) {
              if (!str_contains($e->getMessage(), "4.0 or newer")) {
                  throw $e;
              }
              exit(0);
          }
          throw new RuntimeException("Optional transport provider accepted an unsupported transport version.");
          '

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [verify, verify-core-without-transport, verify-core-with-older-transport]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
